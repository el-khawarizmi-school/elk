<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="libraryHeader">المكتبة الرقمية - ثانوية الخوارزمي</title>
    <meta name="description" content="المكتبة الرقمية لثانوية الخوارزمي - كتب وروايات PDF">
    <meta name="theme-color" content="#667eea">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="theme.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script>
        /* الحفاظ على المظهر المختار (يتزامن مع الصفحة الرئيسية عبر المفتاح 'theme') */
        (function(){
            try{
                var light=localStorage.getItem('theme')==='light', r=document.documentElement;
                r.classList.toggle('light',light);
                r.classList.toggle('dark-mode',!light);
                document.addEventListener('DOMContentLoaded',function(){
                    document.body.classList.toggle('dark-mode',!light);
                    var m=document.querySelector('meta[name="theme-color"]');
                    if(m)m.setAttribute('content',light?'#e4e8f2':'#0a0820');
                });
            }catch(e){}
        })();
    </script>
    
    <style>
        /* ===== أنماط خاصة بـ Library فقط ===== */
        .library-container {
            min-height: 100vh;
            padding: 1.5rem;
        }

        .library-header {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            padding: 1.5rem;
            text-align: center;
            margin-bottom: 2rem;
            box-shadow: var(--glass-shadow);
        }

        .library-header h1 {
            color:var(--th-text);
            font-size: 2rem;
        }

        .library-header p {
            color: var(--text-secondary);
            margin-top: 0.5rem;
        }

        /* ===== الإحصائيات ===== */
        .stats-mini {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .stat-mini-card {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            padding: 0.8rem;
            text-align: center;
            transition: all var(--transition-base);
            box-shadow: var(--glass-shadow);
        }

        .stat-mini-card:hover {
            background: var(--glass-bg-hover);
            transform: translateY(-3px);
        }

        .stat-mini-card .number {
            color: var(--accent-gold);
            font-size: 1.5rem;
            font-weight: 700;
        }

        .stat-mini-card .label {
            color: var(--text-muted);
            font-size: 0.65rem;
        }

        /* ===== شريط الفلترة ===== */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-bottom: 1.5rem;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: var(--glass-blur);
            padding: 0.8rem;
            border-radius: var(--radius-lg);
            justify-content: center;
            box-shadow: var(--glass-shadow);
        }

        .filter-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 0.4rem 1.2rem;
            border-radius: var(--radius-full);
            color: var(--text-secondary);
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-size: 0.85rem;
            transition: all var(--transition-base);
        }

        .filter-btn:hover, .filter-btn.active {
            background: rgba(255,215,0,0.2);
            border-color: var(--accent-gold);
            color:var(--th-text);
        }

        /* ===== شريط الأزرار ===== */
        .actions-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 1.5rem;
        }

        .btn-add {
            background: var(--gradient-gold);
            color: #1a1a2e;
            padding: 0.5rem 1.2rem;
            border: none;
            border-radius: var(--radius-full);
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all var(--transition-base);
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255,215,0,0.3);
        }

        /* ===== شبكة الكتب ===== */
        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .book-card {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 1.2rem;
            text-align: center;
            transition: all var(--transition-base);
            box-shadow: var(--glass-shadow);
        }

        .book-card:hover {
            transform: translateY(-5px);
            background: var(--glass-bg-hover);
            border-color: var(--glass-border-hover);
            box-shadow: var(--glass-shadow-hover);
        }

        .book-card .icon {
            font-size: 2.5rem;
            color: var(--accent-gold);
            margin-bottom: 0.5rem;
        }

        .book-card .title {
            color:var(--th-text);
            font-size: 0.95rem;
            font-weight: 700;
        }

        .book-card .author {
            color: var(--text-muted);
            font-size: 0.7rem;
        }

        .book-card .type {
            display: inline-block;
            background: rgba(255,215,0,0.1);
            border: 1px solid rgba(255,215,0,0.2);
            padding: 0.15rem 0.6rem;
            border-radius: 12px;
            font-size: 0.6rem;
            color: var(--accent-gold);
            margin-top: 4px;
        }

        .book-card .uploader {
            color: var(--text-disabled);
            font-size: 0.6rem;
            margin-top: 4px;
        }

        .book-card .desc {
            color: var(--text-muted);
            font-size: 0.7rem;
            margin-top: 4px;
            padding: 0 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .book-card .actions {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            margin-top: 0.8rem;
            flex-wrap: wrap;
        }

        .btn-action {
            padding: 0.3rem 1rem;
            border: none;
            border-radius: var(--radius-full);
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.75rem;
            transition: all var(--transition-base);
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        .btn-action:hover { transform: scale(1.05); }

        .btn-read {
            background: var(--gradient-info);
            color:var(--th-text);
        }

        .btn-no-pdf {
            background: var(--glass-bg);
            color: var(--text-disabled);
            border: 1px dashed var(--glass-border);
            cursor: default;
            font-size: 0.6rem;
        }

        .btn-no-pdf:hover { transform: none; }

        .btn-del {
            background: rgba(255,107,107,0.15);
            color: var(--accent-red);
            border: 1px solid rgba(255,107,107,0.2);
        }

        .btn-del:hover { background: rgba(255,107,107,0.3); }

        /* ===== زر العودة ===== */
        .btn-back {
            display: inline-block;
            padding: 0.5rem 1.5rem;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-full);
            color:var(--th-text);
            text-decoration: none;
            margin-top: 1rem;
            transition: all var(--transition-base);
        }

        .btn-back:hover {
            background: var(--glass-bg-hover);
            transform: translateY(-2px);
        }

        /* ===== Modal ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal-overlay.active { display: flex; }

        .modal-box {
            background: var(--glass-bg-strong);
            backdrop-filter: var(--glass-blur-strong);
            border-radius: var(--radius-2xl);
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 1.5rem;
            border: 1px solid var(--glass-border);
            animation: modalFadeIn 0.3s ease;
            box-shadow: var(--glass-shadow-lg);
        }

        .modal-box h3 {
            color:var(--th-text);
            font-size: 1.2rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .modal-box h3 i { color: var(--accent-gold); }

        .modal-box .form-group { margin-bottom: 1rem; }

        .modal-box .form-group label {
            color: var(--text-secondary);
            font-size: 0.8rem;
            display: block;
            margin-bottom: 0.3rem;
        }

        .modal-box .form-group input,
        .modal-box .form-group select,
        .modal-box .form-group textarea {
            width: 100%;
            padding: 0.6rem 0.8rem;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            color:var(--th-text);
            font-family: 'Cairo', sans-serif;
            font-size: 0.85rem;
            transition: all var(--transition-base);
        }

        .modal-box .form-group input:focus,
        .modal-box .form-group select:focus,
        .modal-box .form-group textarea:focus {
            outline: none;
            border-color: var(--accent-gold);
            background: var(--glass-bg-hover);
        }

        .modal-box .form-group select option {
            background: #1a1a2e;
            color: white;
        }

        .modal-box .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .modal-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .modal-actions button {
            padding: 0.5rem 1.5rem;
            border: none;
            border-radius: var(--radius-md);
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-base);
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .modal-actions .btn-submit {
            background: var(--gradient-gold);
            color: #1a1a2e;
        }

        .modal-actions .btn-submit:hover { transform: translateY(-2px); }
        .modal-actions .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

        .modal-actions .btn-cancel {
            background: var(--glass-bg);
            color:var(--th-text);
            border: 1px solid var(--glass-border);
        }

        .modal-actions .btn-cancel:hover { background: var(--glass-bg-hover); }

        /* ===== Responsive ===== */
        @media (max-width: 768px) {
            .library-container { padding: 0.8rem; }
            .books-grid { grid-template-columns: repeat(2, 1fr); }
            .library-header h1 { font-size: 1.5rem; }
        }

        @media (max-width: 480px) {
            .books-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="offline-banner" id="offlineBanner">
        <i class="fas fa-wifi"></i> أنت غير متصل بالإنترنت - بعض الميزات قد لا تعمل
    </div>

    <div class="library-container">
        <!-- ===== الهيدر ===== -->
        <div class="library-header">
            <h1><i class="fas fa-book"></i> <span data-i18n="libraryHeader">المكتبة الرقمية</span></h1>
            <p data-i18n="libraryDesc">اكتشف الكتب والمراجع التعليمية 📚</p>
        </div>

        <!-- ===== الإحصائيات ===== -->
        <div class="stats-mini">
            <div class="stat-mini-card">
                <div class="number" id="totalBooks">0</div>
                <div class="label" data-i18n="totalBooks">📚 إجمالي الكتب</div>
            </div>
            <div class="stat-mini-card">
                <div class="number" id="pdfBooks">0</div>
                <div class="label" data-i18n="pdfBooks">📄 كتب PDF</div>
            </div>
            <div class="stat-mini-card">
                <div class="number" id="booksCount">0</div>
                <div class="label" data-i18n="booksCount">📖 كتب</div>
            </div>
            <div class="stat-mini-card">
                <div class="number" id="novelsCount">0</div>
                <div class="label" data-i18n="novelsCount">📕 روايات</div>
            </div>
        </div>

        <!-- ===== شريط الفلترة ===== -->
        <div class="filter-bar">
            <button class="filter-btn active" data-type="all" onclick="window.filterBooks('all')" data-i18n="all">📋 الكل</button>
            <button class="filter-btn" data-type="كتاب" onclick="window.filterBooks('كتاب')" data-i18n="booksCount">📖 كتب</button>
            <button class="filter-btn" data-type="رواية" onclick="window.filterBooks('رواية')" data-i18n="novelsCount">📕 روايات</button>
        </div>

        <!-- ===== زر الإضافة ===== -->
        <div class="actions-bar">
            <button class="btn-add" id="addBtn">
                <i class="fas fa-plus"></i> <span data-i18n="addBook">إضافة كتاب</span>
            </button>
        </div>

        <!-- ===== شبكة الكتب ===== -->
        <div class="books-grid" id="booksGrid">
            <div class="skeleton-card">
                <div class="skeleton-icon" style="width:50px;height:50px;margin:0 auto 1rem;"></div>
                <div class="skeleton-line"></div>
                <div class="skeleton-line short"></div>
            </div>
            <div class="skeleton-card">
                <div class="skeleton-icon" style="width:50px;height:50px;margin:0 auto 1rem;"></div>
                <div class="skeleton-line"></div>
                <div class="skeleton-line short"></div>
            </div>
            <div class="skeleton-card">
                <div class="skeleton-icon" style="width:50px;height:50px;margin:0 auto 1rem;"></div>
                <div class="skeleton-line"></div>
                <div class="skeleton-line short"></div>
            </div>
        </div>

        <!-- ===== زر العودة ===== -->
        <div style="text-align: center; margin-top: 2rem;">
            <a href="dashboard.html" class="btn-back">
                <i class="fas fa-arrow-right"></i> <span data-i18n="backToDashboard">العودة للوحة التحكم</span>
            </a>
        </div>
    </div>

    <!-- ===== Modal إضافة كتاب ===== -->
    <div class="modal-overlay" id="modal">
        <div class="modal-box">
            <h3><i class="fas fa-upload"></i> <span data-i18n="addBook">إضافة كتاب جديد</span></h3>
            <p style="color:var(--text-muted); font-size:0.8rem; margin-bottom:1rem;">
                <span data-i18n="shareResources">شارك مع زملائك 📚 سيظهر الكتاب للجميع فور نشره</span>
            </p>
            <form id="form">
                <div class="form-group">
                    <label data-i18n="bookTitle">عنوان الكتاب *</label>
                    <input type="text" id="title" placeholder="مثال: الأيام" required maxlength="200">
                </div>
                <div class="form-group">
                    <label data-i18n="author">المؤلف</label>
                    <input type="text" id="author" placeholder="مثال: طه حسين" maxlength="100">
                </div>
                <div class="form-group">
                    <label data-i18n="bookType">النوع *</label>
                    <select id="type" required>
                        <option value="كتاب">📖 كتاب</option>
                        <option value="رواية">📕 رواية</option>
                    </select>
                </div>
                <div class="form-group">
                    <label data-i18n="bookDesc">الوصف</label>
                    <textarea id="description" placeholder="وصف مختصر للكتاب" maxlength="500"></textarea>
                </div>
                <div class="form-group">
                    <label data-i18n="pdfLink">رابط PDF (من مكتبة نور)</label>
                    <input type="url" id="pdfUrl" placeholder="https://www.noor-book.com/كتاب-العنوان-pdf">
                    <p style="color:var(--text-disabled); font-size:0.6rem; margin-top:4px;">
                        <span data-i18n="pdfLinkHint">أو اتركه فارغاً ليرفعه التلاميذ لاحقاً</span>
                    </p>
                </div>
                <div class="modal-actions">
                    <button type="submit" class="btn-submit" id="submitBtn">
                        <i class="fas fa-check"></i> <span data-i18n="publish">نشر الكتاب</span>
                    </button>
                    <button type="button" class="btn-cancel" onclick="window.closeModal()">
                        <i class="fas fa-times"></i> <span data-i18n="cancel">إلغاء</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="darkmode.js"></script>
    <script type="module">
        import { supabase, showToast, escapeHtml, getCurrentUser } from './supabase.js';
        import { initLanguage, getCurrentLanguage, translate } from './language.js';
        
        initLanguage();
        
        function updateOnlineStatus() {
            const banner = document.getElementById('offlineBanner');
            if (!banner) return;
            if (navigator.onLine) banner.classList.remove('active');
            else banner.classList.add('active');
        }
        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);
        updateOnlineStatus();
        
        const user = getCurrentUser();
        let books = [];
        let filter = 'all';
        let isLoading = false;
        
        async function loadBooks() {
            if (isLoading) return;
            isLoading = true;
            
            try {
                const { data, error } = await supabase
                    .from('books')
                    .select('*')
                    .order('created_at', { ascending: false });
                
                if (error) throw error;
                books = data || [];
                render();
                updateStats();
            } catch (e) {
                console.error('خطأ في تحميل الكتب:', e);
                document.getElementById('booksGrid').innerHTML = `
                    <div class="empty-state" style="grid-column: 1/-1;">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>خطأ في التحميل</p>
                        <button onclick="window.loadBooks()" class="btn-add" style="margin-top:10px;">
                            <i class="fas fa-sync"></i> إعادة المحاولة
                        </button>
                    </div>
                `;
            } finally {
                isLoading = false;
            }
        }
        
        function updateStats() {
            const withPdf = books.filter(b => b.pdf_url && b.pdf_url !== '#' && b.pdf_url !== '' && b.pdf_url !== 'null');
            document.getElementById('totalBooks').textContent = books.length;
            document.getElementById('pdfBooks').textContent = withPdf.length;
            document.getElementById('booksCount').textContent = books.filter(b => b.type === 'كتاب').length;
            document.getElementById('novelsCount').textContent = books.filter(b => b.type === 'رواية').length;
        }
        
        window.filterBooks = function(type) {
            filter = type;
            document.querySelectorAll('.filter-btn').forEach(b => {
                b.classList.remove('active');
                if (b.dataset.type === type) b.classList.add('active');
            });
            render();
        };
        
        function render() {
            const grid = document.getElementById('booksGrid');
            let filtered = filter === 'all' ? books : books.filter(b => b.type === filter);
            
            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1/-1;">
                        <i class="fas fa-inbox"></i>
                        <p data-i18n="noBooks">لا توجد كتب</p>
                    </div>
                `;
                return;
            }
            
            grid.innerHTML = filtered.map(b => {
                const isOwner = user && b.uploaded_by_name === user.name;
                const hasPdf = b.pdf_url && b.pdf_url !== '#' && b.pdf_url !== '' && b.pdf_url !== 'null';
                
                return `
                <div class="book-card">
                    <div class="icon">${b.cover || '📚'}</div>
                    <div class="title">${escapeHtml(b.title)}</div>
                    <div class="author">✍️ ${escapeHtml(b.author || 'مجهول')}</div>
                    <div class="type">${b.type === 'رواية' ? '📕 رواية' : '📖 كتاب'}</div>
                    <div class="uploader">👤 ${escapeHtml(b.uploaded_by_name || 'مجهول')}</div>
                    ${b.description ? `<div class="desc">${escapeHtml(b.description)}</div>` : ''}
                    <div class="actions">
                        ${hasPdf ? `
                            <button class="btn-action btn-read" onclick="window.readBook('${b.id}')">
                                <i class="fas fa-eye"></i> <span data-i18n="read">قراءة</span>
                            </button>
                        ` : `
                            <span class="btn-action btn-no-pdf">
                                <i class="fas fa-times"></i> <span data-i18n="noPdf">لا يوجد PDF</span>
                            </span>
                        `}
                        ${isOwner ? `
                            <button class="btn-action btn-del" onclick="window.deleteBook('${b.id}')">
                                <i class="fas fa-trash"></i>
                            </button>
                        ` : ''}
                    </div>
                </div>
            `}).join('');
        }
        
        window.readBook = function(id) {
            const b = books.find(x => x.id === id);
            if (!b) { showToast('❌ الكتاب غير موجود', 'error'); return; }
            if (b.pdf_url && b.pdf_url !== '#' && b.pdf_url !== '' && b.pdf_url !== 'null') {
                window.open(b.pdf_url, '_blank');
            } else {
                showToast('📖 هذا الكتاب غير متوفر حالياً', 'info');
            }
        };
        
        window.deleteBook = async function(id) {
            if (!user) { showToast('⚠️ سجل الدخول أولاً', 'error'); return; }
            const b = books.find(x => x.id === id);
            if (!b || b.uploaded_by_name !== user.name) {
                showToast('⛔ يمكنك حذف كتبك فقط', 'error');
                return;
            }
            if (!confirm('حذف هذا الكتاب؟')) return;
            
            try {
                const { error } = await supabase.from('books').delete().eq('id', id);
                if (error) throw error;
                showToast('🗑️ تم الحذف', 'success');
                await loadBooks();
            } catch (e) {
                showToast('❌ ' + e.message, 'error');
            }
        };
        
        window.closeModal = function() {
            document.getElementById('modal').classList.remove('active');
            document.body.style.overflow = '';
            document.getElementById('form').reset();
        };
        
        document.getElementById('addBtn').addEventListener('click', () => {
            if (!user) {
                showToast('⚠️ سجل الدخول أولاً', 'error');
                window.location.href = 'login.html';
                return;
            }
            document.getElementById('modal').classList.add('active');
            document.body.style.overflow = 'hidden';
        });
        
        document.getElementById('modal').addEventListener('click', e => {
            if (e.target === e.currentTarget) window.closeModal();
        });
        
        document.getElementById('form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if (!user) { showToast('⚠️ سجل الدخول أولاً', 'error'); return; }
            
            const title = document.getElementById('title').value.trim();
            const author = document.getElementById('author').value.trim();
            const type = document.getElementById('type').value;
            const description = document.getElementById('description').value.trim();
            const pdfUrl = document.getElementById('pdfUrl').value.trim();
            
            if (!title) { showToast('⚠️ اكتب عنوان الكتاب', 'error'); return; }
            
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري النشر...';
            
            try {
                const { error: insertErr } = await supabase
                    .from('books')
                    .insert({
                        title: title,
                        author: author || null,
                        type: type,
                        description: description || null,
                        pdf_url: pdfUrl || null,
                        cover: type === 'رواية' ? '📕' : '📚',
                        uploaded_by: user.id,
                        uploaded_by_name: user.name
                    });
                
                if (insertErr) throw new Error(insertErr.message);
                
                showToast('✅ ' + translate('bookAdded'), 'success');
                window.closeModal();
                await loadBooks();
            } catch (e) {
                console.error('خطأ:', e);
                showToast('❌ ' + e.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-check"></i> نشر الكتاب';
            }
        });
        
        window.loadBooks = loadBooks;
        loadBooks();
    </script>
        <link rel="stylesheet" href="responsive.css">
    <link rel="stylesheet" href="enhancements.css">
</body>
</html>
