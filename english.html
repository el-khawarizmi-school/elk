<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        /* الحفاظ على المظهر المختار (يتزامن مع الصفحة الرئيسية عبر المفتاح 'theme') */
        (function(){
            try{
                var light=localStorage.getItem('theme')==='light', r=document.documentElement;
                r.classList.toggle('light',light);
                r.classList.toggle('dark-mode',!light);
                document.addEventListener('DOMContentLoaded',function(){
                    document.body.classList.toggle('dark-mode',!light);
                    var m=document.querySelector('meta[name="theme-color"]');
                    if(m)m.setAttribute('content',light?'#e4e8f2':'#0a0820');
                });
            }catch(e){}
        })();
    </script>
    <title>تعلم اللغات الأجنبية - ثانوية الخوارزمي</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="theme.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-dark: rgba(30, 41, 59, 0.7);
            --border-dark: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #5b9cf5;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

        /* Header */
        .header {
            background: var(--th-panel); backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border-dark); padding: 1rem 2rem;
            display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 100;
        }
        .header h1 { font-size: 1.3rem; font-weight: 800; display: flex; align-items: center; gap: 0.8rem; }
        .header h1 i { color: var(--accent-blue); }
        .btn-back {
            color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: 0.9rem;
            display: flex; align-items: center; gap: 0.5rem; transition: color 0.2s;
            background:var(--th-surface-1); padding: 0.6rem 1.2rem; border-radius: 50px;
            border: 1px solid var(--border-dark);
        }
        .btn-back:hover { color:var(--th-text); background:var(--th-surface-2); }

        /* Container */
        .container { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; width: 100%; flex: 1; }

        /* Intro Section */
        .intro {
            text-align: center; margin-bottom: 3rem; padding: 2rem;
            background: linear-gradient(135deg, rgba(91, 156, 245, 0.1), rgba(157, 124, 245, 0.1));
            border: 1px solid rgba(91, 156, 245, 0.2); border-radius: 24px;
        }
        .intro h2 { font-size: 1.8rem; margin-bottom: 0.5rem; }
        .intro p { color: var(--text-muted); font-size: 1rem; }

        /* Grid */
        .sites-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem;
        }

        /* Card */
        .site-card {
            background: var(--card-dark); border: 1px solid var(--border-dark); border-radius: 20px;
            padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem;
            transition: all 0.3s ease; text-decoration: none; color:var(--th-text); position: relative;
        }
        .site-card:hover {
            transform: translateY(-8px); border-color: rgba(91, 156, 245, 0.5);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3), 0 0 20px rgba(91, 156, 245, 0.1);
            background: var(--th-panel);
        }

        .site-header { display: flex; align-items: center; gap: 1rem; }
        .site-icon {
            width: 50px; height: 50px; border-radius: 14px; display: flex;
            align-items: center; justify-content: center; font-size: 1.5rem; flex-shrink: 0;
        }
        .site-name { font-size: 1.1rem; font-weight: 800; }
        .site-lang { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; margin-top: 2px; }
        
        .site-desc { font-size: 0.85rem; color: var(--text-muted); line-height: 1.6; flex: 1; }
        
        .site-footer {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 0.5rem; padding-top: 1rem; border-top: 1px solid var(--border-dark);
        }
        .site-level { font-size: 0.7rem; background:var(--th-surface-1); padding: 0.2rem 0.6rem; border-radius: 10px; color: var(--text-muted); }
        .site-link { font-size: 0.8rem; color: var(--accent-blue); font-weight: 700; display: flex; align-items: center; gap: 0.3rem; }
    </style>
</head>
<body>

    <header class="header">
        <h1><i class="fas fa-globe"></i> تعلم اللغات الأجنبية</h1>
        <a href="dashboard.html" class="btn-back"><i class="fas fa-arrow-right"></i> العودة للوحة التحكم</a>
    </header>

    <main class="container">
        
        <div class="intro">
            <h2>اختر لغتك وابدأ التعلم</h2>
            <p>مجموعة مختارة من أفضل المواقع العالمية المجانية لتعلم اللغة الإنجليزية، الفرنسية، والإسبانية.</p>
        </div>

        <div class="sites-grid" id="sitesGrid">
            <!-- سيتم تحميل البطاقات هنا بواسطة الجافاسكريبت -->
        </div>

    </main>

    <script>
        // بيانات أفضل 10 مواقع لتعلم اللغات
        const learningSites = [
            {
                name: 'Duolingo',
                lang: 'الإنجليزية، الفرنسية، الإسبانية...',
                desc: 'أشهر تطبيق في العالم لتعلم اللغات بأسلوب اللعب (Gamification). ممتاز للمبتدئين.',
                icon: 'fa-robot', color: '#58cc02',
                level: 'A1 - B1',
                url: 'https://www.duolingo.com/'
            },
            {
                name: 'BBC Learning English',
                lang: 'الإنجليزية',
                desc: 'دروس مجانية من هيئة الإذاعة البريطانية. تركز على القواعد، المفردات، والنطق الصحيح.',
                icon: 'fa-newspaper', color: '#bb1919',
                level: 'A2 - C1',
                url: 'https://www.bbc.co.uk/learningenglish/'
            },
            {
                name: 'British Council',
                lang: 'الإنجليزية',
                desc: 'المجلس الثقافي البريطاني. يوفر تمارين تفاعلية، ألعاب، ودروس منظمة حسب المستوى.',
                icon: 'fa-university', color: '#003087',
                level: 'A1 - C1',
                url: 'https://learnenglish.britishcouncil.org/'
            },
            {
                name: 'TV5MONDE',
                lang: 'الفرنسية',
                desc: 'أفضل موقع لتعلم الفرنسية. يعتمد على مقاطع فيديو إخبارية حقيقية مع تمارين تفاعلية.',
                icon: 'fa-tv', color: '#0d4785',
                level: 'A1 - B2',
                url: 'https://apprendre.tv5monde.com/'
            },
            {
                name: 'Cambridge Dictionary',
                lang: 'الإنجليزية',
                desc: 'ليس مجرد قاموس! يحتوي على قواعد، أمثلة، واختبارات لتحسين مستواك.',
                icon: 'fa-book', color: '#a41034',
                level: 'جميع المستويات',
                url: 'https://dictionary.cambridge.org/'
            },
            {
                name: 'Quizlet',
                lang: 'الإنجليزية، الفرنسية',
                desc: 'أداة ممتازة لحفظ المفردات باستخدام البطاقات التعليمية (Flashcards).',
                icon: 'fa-layer-group', color: '#4255ff',
                level: 'جميع المستويات',
                url: 'https://quizlet.com/'
            },
            {
                name: 'Lingolia',
                lang: 'الإنجليزية، الفرنسية، الإسبانية',
                desc: 'شروحات مبسطة للقواعد اللغوية مع تمارين تفاعلية وتصحيح فوري.',
                icon: 'fa-spell-check', color: '#f59e0b',
                level: 'A1 - B2',
                url: 'https://www.lingolia.com/'
            },
            {
                name: 'ESL Fast',
                lang: 'الإنجليزية',
                desc: 'قصص قصيرة ومحادثات يومية مكتوبة بصوت واضح، ممتازة لتحسين مهارة الاستماع (Listening).',
                icon: 'fa-headphones', color: '#8b5cf6',
                level: 'A1 - B1',
                url: 'https://www.eslfast.com/'
            },
            {
                name: 'Español Plus',
                lang: 'الإسبانية',
                desc: 'بودكاست مجاني ودروس منظمة لتعلم اللغة الإسبانية من الصفر.',
                icon: 'fa-podcast', color: '#ef4444',
                level: 'A1 - B1',
                url: 'https://espanolplus.com/'
            },
            {
                name: 'Babbel',
                lang: 'الإنجليزية، الفرنسية، الإسبانية',
                desc: 'منصة مدفوعة جزئياً، لكنها توفر دروساً مجانية قوية تركز على المحادثة العملية.',
                icon: 'fa-comments', color: '#f59e0b',
                level: 'A1 - B2',
                url: 'https://www.babbel.com/'
            }
        ];

        function renderSites() {
            const grid = document.getElementById('sitesGrid');
            grid.innerHTML = learningSites.map((site, index) => `
                <a href="${site.url}" target="_blank" rel="noopener" class="site-card">
                    <div class="site-header">
                        <div class="site-icon" style="background: ${site.color}20; color: ${site.color}; border: 1px solid ${site.color}40;">
                            <i class="fas ${site.icon}"></i>
                        </div>
                        <div>
                            <div class="site-name">${site.name}</div>
                            <div class="site-lang">${site.lang}</div>
                        </div>
                    </div>
                    <div class="site-desc">${site.desc}</div>
                    <div class="site-footer">
                        <span class="site-level">${site.level}</span>
                        <span class="site-link">زيارة الموقع <i class="fas fa-external-link-alt"></i></span>
                    </div>
                </a>
            `).join('');
        }

        renderSites();
    </script>
</body>
</html>
